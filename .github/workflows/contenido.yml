name: contenido
# Descarga las lecturas del día (dos veces al día) y, si cambian los scripts, las oraciones del Rosario.
on:
  schedule:
    - cron: "15 2 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch:
  push:
    paths: [scripts/palabra.py, scripts/bci.py, scripts/oraciones.py, .github/workflows/contenido.yml]
permissions:
  contents: write
concurrency: contenido
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 pypdf
      - name: Lecturas del día
        run: python scripts/palabra.py
      - name: Oraciones del Rosario
        if: github.event_name != 'schedule' || hashFiles('data/oraciones.js') == ''
        run: python scripts/oraciones.py
      - name: Guardar cambios
        run: |
          git config user.name "misas-barcelona bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/palabra data/oraciones.js 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Lecturas y oraciones actualizadas ($(date -u +%F))"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
