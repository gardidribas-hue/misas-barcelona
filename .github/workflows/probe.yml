name: probe-palabra
on:
  push:
    branches: [claude/project-thread-3pofmn]
    paths: [scripts/probe_*.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 pypdf
      - run: python scripts/probe_pdf.py "https://multimedia.opusdei.org/doc/pdf/Devocionari%20mobil%20-%20www.opusdei.cat20220314171720840413.pdf" "Senyal" "Credo" "Crec en" "Pare nostre" "Déu vos salve" "Glòria al" "Oh Jesús" "Salve" "Rosari" | head -80
      - run: python scripts/probe_palabra.py https://www.aciprensa.com/recurso/464/oraciones-del-rosario | head -150
