name: estadisticas

# Cada día a las 3:00 UTC (los lunes, antes de la lectura de horarios de las 3:30) guarda los totales de GoatCounter
# para el panel del proyecto. Se puede lanzar a mano desde Actions.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar estadísticas
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/estadisticas.py
      - name: Guardar cambios
        run: |
          git config user.name "misas-barcelona bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estadisticas/goatcounter.json
          if ! git diff --cached --quiet; then git commit -q -m "Estadísticas de GoatCounter ($(date -u +%F))"; git push -q; fi
