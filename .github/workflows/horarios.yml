name: horarios
# Una vez por semana lee las fuentes de cada templo (web propia, Arzobispado, OpenStreetMap) y guarda
# los horarios en data/horarios/ y en el Excel de revisión. Al tocar los scripts, solo prueba los 5 templos de ejemplo.
# La lectura semanal guarda además el texto entero de cada fuente en la rama «fuentes» (ver scripts/fuentes_texto.py).
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs separados por comas (vacío = todos)"
        required: false
  push:
    paths: [scripts/horarios.py, scripts/horarios_texto.py, scripts/horarios_app.py, scripts/horarios_excel.py, data/horarios/correcciones.json, .github/workflows/horarios.yml]
permissions:
  contents: write
concurrency: horarios
env:
  PRUEBA: BCN0003,BCN0213,BCN0226,BCN0092,BCN0212
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-cat tesseract-ocr-spa poppler-utils >/dev/null
          pip install -q beautifulsoup4 pypdf openpyxl
      - name: Leer las fuentes
        run: |
          IDS="${{ github.event.inputs.ids }}"
          if [ "${{ github.event_name }}" = "push" ]; then IDS="$PRUEBA"; fi
          python scripts/horarios.py actualizar --ids "$IDS"
      - name: Guardar cambios
        run: |
          git config user.name "misas-barcelona bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horarios
          if ! git diff --cached --quiet; then git commit -q -m "Horarios actualizados ($(date -u +%F))"; fi
          git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}"
          # Lectura semanal completa: descarga entera de cada fuente (rama «fuentes»), comprobación de la web (K),
          # segunda lectura automática (C2) y huellas (M). Las usan las lecturas de Claude (D, E, L): scripts/lecturas.py.
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.ids }}" ]; }; then
            python scripts/fuentes_texto.py /tmp/fuentes
            if git fetch -q origin fuentes; then git worktree add -q /tmp/wt FETCH_HEAD; else git worktree add -q --orphan -b fuentes /tmp/wt; fi
            rm -f /tmp/wt/fuentes/*.txt && mkdir -p /tmp/wt/fuentes && cp /tmp/fuentes/*.txt /tmp/wt/fuentes/
            (cd /tmp/wt && git add -A fuentes && { git diff --cached --quiet || git commit -q -m "Texto de las fuentes ($(date -u +%F))"; } && git push -q origin HEAD:refs/heads/fuentes)
          fi
          # El Excel de revisión y la web se generan después de traer lo último, para no pisar una revisión subida mientras tanto.
          python scripts/horarios_excel.py generar
          python scripts/horarios_app.py
          python scripts/paginas.py
          git add data/horarios p sitemap.xml robots.txt
          if ! git diff --cached --quiet; then git commit -q -m "Excel de revisión y web de horarios ($(date -u +%F))"; fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
