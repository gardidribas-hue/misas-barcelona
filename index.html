<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misas Barcelona</title>
<meta name="description" content="Encuentra misas, confesiones y adoración eucarística en las parroquias de la Archidiócesis de Barcelona.">
<meta name="theme-color" content="#2f2729">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preload" as="script" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
</head>
<body class="loading">

<!-- Pantalla de carga: se va en cuanto el mapa y los datos están listos -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-in">
    <span class="splash-logo"><span class="b-main" data-i18n="brandMain">Misas</span> <em>Barcelona</em></span>
    <span class="splash-bar"><i></i></span>
  </div>
</div>

<header class="top">
  <button type="button" class="brand" data-go="home" aria-label="Misas, Archidiócesis de Barcelona. Inicio"><span class="b-main" data-i18n="brandMain">Misas</span><span class="b-stack"><em class="b-arch" data-i18n="brandArch">Archidiócesis de</em><em class="b-city">Barcelona</em></span></button>
  <div class="top-right">
    <nav class="tabs" aria-label="Vistas">
      <button type="button" data-go="home" class="on" data-i18n="tabHome">Inicio</button>
      <button type="button" data-go="chat" data-i18n="tabChat">Chat</button>
      <button type="button" data-go="map" data-i18n="tabMap">Mapa</button>
    </nav>
    <nav class="extras" aria-label="Oración">
      <button type="button" data-go="word" class="x-word"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10.2 5.2 7.6 4.6 4.5 4.6v12.8c3.1 0 5.7.6 7.5 2 1.8-1.4 4.4-2 7.5-2V4.6c-3.1 0-5.7.6-7.5 2zM12 6.6v12.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 8.2v4M6.6 9.6h2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span><span data-i18n="tabWord">Palabra del día</span></button>
      <button type="button" data-go="rosary" class="x-ros"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="2.9" r="1.25"/><circle cx="16.2" cy="4.6" r="1.25"/><circle cx="18" cy="8.8" r="1.25"/><circle cx="16.2" cy="13" r="1.25"/><circle cx="7.8" cy="13" r="1.25"/><circle cx="6" cy="8.8" r="1.25"/><circle cx="7.8" cy="4.6" r="1.25"/><circle cx="12" cy="14.9" r="1.45"/></g><path d="M12 16.4v6M9.6 18.7h4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span data-i18n="tabRosary">Rosario</span></button>
    </nav>
    <div class="langs" id="langs" role="group" aria-label="Idioma"><button type="button" data-lang="es" aria-label="Castellano" title="Castellano"></button><button type="button" data-lang="ca" aria-label="Català" title="Català"></button></div>
  </div>
</header>

<main class="stage" id="stage" data-mode="home">

  <!-- Columna del chat -->
  <section class="chatcol win" aria-label="Asistente">
    <div class="chat-scroll" id="chatScroll">
      <div class="hero" id="hero">
        <p class="eyebrow" data-i18n-html="eyebrow">Archidiócesis de Barcelona · <span id="parishCount">211</span> parroquias</p>
        <h1 data-i18n-html="heroTitle">¿Dónde quieres ir a <em>misa</em>?</h1>
        <p class="lede" data-i18n-html="heroLede">Dime dónde estás y a qué hora te va bien. También busco <strong class="k-conf"><em>confesiones</em></strong> y <strong class="k-ador"><em>adoración</em></strong>.</p>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>
    <div class="dock">
      <form class="composer" id="chatForm" autocomplete="off">
        <textarea id="chatInput" rows="1" aria-label="Escribe dónde y cuándo quieres ir a misa"></textarea>
        <button class="send" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <ul class="ideas" id="ideas" aria-label="Ideas para preguntar"></ul>
    </div>
  </section>

  <!-- Columna del mapa: filtros + lista + mapa -->
  <section class="mapcol" aria-label="Mapa y filtros">
    <aside class="side win" id="side">
      <div class="filters" id="filters">
        <div class="seg kinds" role="group" aria-label="Qué buscas">
          <button type="button" data-kind="mass" class="on" data-i18n="kindMass">Misa</button>
          <button type="button" data-kind="confession" data-i18n="kindConf">Confesión</button>
          <button type="button" data-kind="adoration" data-i18n="kindAdor">Adoración</button>
        </div>
        <div class="grid3">
          <label><span data-i18n="lblDay">Día</span><select id="fDay"></select></label>
          <label><span data-i18n="lblFrom">Desde</span><select id="fFrom"></select></label>
          <label><span data-i18n="lblTo">Hasta</span><select id="fTo"></select></label>
        </div>
        <div class="grid2">
          <label><span data-i18n="lblMun">Municipio</span><select id="fMun"></select></label>
          <label><span data-i18n="lblLang">Idioma</span><select id="fLang">
            <option value="" data-i18n="langAny">Cualquiera</option><option value="ca" data-i18n="langCa">Catalán</option>
            <option value="es" data-i18n="langEs">Castellano</option><option value="other" data-i18n="langOther">Otros idiomas</option>
          </select></label>
        </div>
        <div class="districts" id="districts" hidden>
          <span class="label" data-i18n="lblDist">Distritos</span>
          <div class="chips" id="distChips"></div>
        </div>
        <input id="fText" type="search" placeholder="Nombre de la parroquia o calle" data-i18n-ph="searchPh" aria-label="Buscar por nombre o calle">
        <button type="button" class="link" id="reset" data-i18n="reset">Quitar filtros</button>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
      <ul class="cards list" id="list">
        <li class="skel"></li><li class="skel"></li><li class="skel"></li><li class="skel"></li>
      </ul>
      <section class="detail" id="detail" hidden aria-label="Ficha de la parroquia"></section>
    </aside>
    <div class="mapwrap win">
      <div id="map" role="region" aria-label="Mapa de parroquias"></div>
      <div class="floatbar" id="floatbar">
        <div class="seg kinds mini" role="group" aria-label="Qué buscas">
          <button type="button" data-kind="mass" class="on" data-i18n="kindMass">Misa</button>
          <button type="button" data-kind="confession" data-i18n="kindConf">Confesión</button>
          <button type="button" data-kind="adoration" data-i18n="kindAdor">Adoración</button>
        </div>
        <button type="button" class="pill" data-go="map" data-i18n="filtersList">Filtros y lista</button>
      </div>
      <div class="mapbtns">
      <button type="button" class="near reset" id="resetMap" data-i18n-aria="resetMap" aria-label="Restablecer mapa">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="resetMap">Restablecer mapa</span>
      </button>
      <button type="button" class="near" id="nearBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
        <span data-i18n="nearMe">Cerca de mí</span>
      </button>
      </div>
      <div class="maplabel" id="mapLabel"></div>
    </div>
  </section>

  <!-- Palabra del día: lecturas de la misa -->
  <section class="wordcol win" id="wordcol" data-kind="word" aria-label="Palabra del día">
    <div class="dev-scroll" id="wordScroll">
      <div class="dev-inner">
        <header class="dev-head">
          <p class="eyebrow" id="wordDate"></p>
          <h1 data-i18n-html="wordTitle">Palabra <em>del día</em></h1>
          <p class="dev-sub" id="wordLit"></p>
          <div class="daynav">
            <button type="button" class="pill" id="wordPrev" aria-label="Día anterior">‹</button>
            <button type="button" class="pill" id="wordToday" data-i18n="todayBtn">Hoy</button>
            <button type="button" class="pill" id="wordNext" aria-label="Día siguiente">›</button>
          </div>
        </header>
        <div class="seg rd" id="wordTabs" role="tablist"></div>
        <article class="reading" id="reading" aria-live="polite"></article>
        <p class="dev-foot" id="wordFoot"></p>
      </div>
    </div>
  </section>

  <!-- Rosario del día -->
  <section class="rosarycol win" id="rosarycol" data-kind="rosary" aria-label="Rosario">
    <div class="dev-scroll" id="rosScroll">
      <div class="dev-inner" id="rosList">
        <header class="dev-head">
          <p class="eyebrow" id="rosDay"></p>
          <h1 id="rosTitle"></h1>
          <div class="ros-tools">
            <div class="chips" id="rosSets"></div>
            <div class="plangs" id="plangs" role="group" aria-label="Idioma del rezo"></div>
          </div>
        </header>
        <ol class="mysteries" id="mysteries"></ol>
        <button type="button" class="pill accent pray" id="prayBtn" data-i18n="prayStart">Rezar el rosario</button>
      </div>
      <div class="pray-mode" id="prayMode" hidden>
        <div class="pray-top">
          <button type="button" class="pill" id="prayExit" data-i18n="prayExit">← Misterios</button>
          <span class="pray-where" id="prayWhere"></span>
        </div>
        <div class="pray-progress"><i id="prayBar"></i></div>
        <div class="pray-card" id="prayCard" tabindex="0">
          <p class="pray-label" id="prayLabel"></p>
          <p class="pray-text" id="prayText"></p>
          <p class="pray-ref" id="prayRef"></p>
        </div>
        <div class="beads" id="beads" aria-hidden="true"></div>
        <div class="pray-nav">
          <button type="button" class="pill" id="prayPrev" data-i18n="prev">Anterior</button>
          <button type="button" class="pill accent" id="prayNext" data-i18n="next">Siguiente</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Navegación inferior en el móvil -->
<nav class="bottomnav" aria-label="Vistas">
  <button type="button" data-go="home" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span data-i18n="tabHome">Inicio</span>
  </button>
  <button type="button" data-go="chat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-7l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span data-i18n="tabChat">Chat</span>
  </button>
  <button type="button" data-go="map">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
    <span data-i18n="tabMap">Mapa</span>
  </button>
  <button type="button" data-go="word" class="x-word">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10.2 5.2 7.6 4.6 4.5 4.6v12.8c3.1 0 5.7.6 7.5 2 1.8-1.4 4.4-2 7.5-2V4.6c-3.1 0-5.7.6-7.5 2zM12 6.6v12.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 8.2v4M6.6 9.6h2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span data-i18n="tabWordShort">Palabra</span>
  </button>
  <button type="button" data-go="rosary" class="x-ros">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="2.9" r="1.25"/><circle cx="16.2" cy="4.6" r="1.25"/><circle cx="18" cy="8.8" r="1.25"/><circle cx="16.2" cy="13" r="1.25"/><circle cx="7.8" cy="13" r="1.25"/><circle cx="6" cy="8.8" r="1.25"/><circle cx="7.8" cy="4.6" r="1.25"/><circle cx="12" cy="14.9" r="1.45"/></g><path d="M12 16.4v6M9.6 18.7h4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span data-i18n="tabRosary">Rosario</span>
  </button>
</nav>

<button type="button" class="totop" id="toTop" aria-label="Volver arriba" data-i18n-aria="toTop" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script defer src="config.js"></script>
<script defer src="data/parroquias.js"></script>
<script defer src="data/geo.js"></script>
<script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin></script>
<script defer src="zonas.js"></script>
<script defer src="app.js"></script>
<script defer src="devocion.js"></script>
</body>
</html>
