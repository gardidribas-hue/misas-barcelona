<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misas Barcelona</title>
<meta name="description" content="Encuentra misas, confesiones y adoración eucarística en las parroquias de la Archidiócesis de Barcelona.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button type="button" class="brand" data-go="home" aria-label="Misas, Archidiócesis de Barcelona. Inicio"><span class="b-main">Misas</span><span class="b-stack"><em class="b-arch">Archidiócesis</em><span class="b-city"><em class="b-de">de</em> <em>Barcelona</em></span></span></button>
  <nav class="tabs" aria-label="Vistas">
    <button type="button" data-go="home" class="on">Inicio</button>
    <button type="button" data-go="chat">Chat</button>
    <button type="button" data-go="map">Mapa</button>
  </nav>
</header>

<main class="stage" id="stage" data-mode="home">

  <!-- Columna del chat -->
  <section class="chatcol win" aria-label="Asistente">
    <div class="chat-scroll" id="chatScroll">
      <div class="hero" id="hero">
        <p class="eyebrow">Archidiócesis de Barcelona · <span id="parishCount">211</span> parroquias</p>
        <h1>¿Dónde quieres ir a <em>misa</em>?</h1>
        <p class="lede">Dime dónde estás y a qué hora te va bien. También busco <strong><em>confesiones</em></strong> y <strong><em>adoración</em></strong>.</p>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>
    <div class="dock">
      <form class="composer" id="chatForm" autocomplete="off">
        <textarea id="chatInput" rows="1" aria-label="Escribe dónde y cuándo quieres ir a misa"></textarea>
        <button class="send" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <ul class="ideas" id="ideas" aria-label="Ideas para preguntar"></ul>
    </div>
  </section>

  <!-- Columna del mapa: filtros + lista + mapa -->
  <section class="mapcol" aria-label="Mapa y filtros">
    <aside class="side win" id="side">
      <div class="filters" id="filters">
        <div class="seg" role="group" aria-label="Qué buscas">
          <button type="button" data-kind="mass" class="on">Misa</button>
          <button type="button" data-kind="confession">Confesión</button>
          <button type="button" data-kind="adoration">Adoración</button>
        </div>
        <div class="grid3">
          <label>Día<select id="fDay"></select></label>
          <label>Desde<select id="fFrom"></select></label>
          <label>Hasta<select id="fTo"></select></label>
        </div>
        <div class="grid2">
          <label>Municipio<select id="fMun"></select></label>
          <label>Idioma<select id="fLang">
            <option value="">Cualquiera</option><option value="ca">Catalán</option>
            <option value="es">Castellano</option><option value="other">Otros idiomas</option>
          </select></label>
        </div>
        <div class="districts" id="districts" hidden>
          <span class="label">Distritos</span>
          <div class="chips" id="distChips"></div>
        </div>
        <input id="fText" type="search" placeholder="Nombre de la parroquia o calle" aria-label="Buscar por nombre o calle">
        <button type="button" class="link" id="reset">Quitar filtros</button>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
      <ul class="cards list" id="list"></ul>
      <section class="detail" id="detail" hidden aria-label="Ficha de la parroquia"></section>
    </aside>
    <div class="mapwrap win">
      <div id="map" role="region" aria-label="Mapa de parroquias"></div>
      <div class="floatbar" id="floatbar">
        <div class="seg mini" role="group" aria-label="Qué buscas">
          <button type="button" data-kind="mass" class="on">Misa</button>
          <button type="button" data-kind="confession">Confesión</button>
          <button type="button" data-kind="adoration">Adoración</button>
        </div>
        <button type="button" class="pill" data-go="map">Filtros y lista</button>
      </div>
      <div class="maplabel" id="mapLabel"></div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="data/parroquias.js"></script>
<script src="data/geo.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="zonas.js"></script>
<script src="app.js"></script>
</body>
</html>
