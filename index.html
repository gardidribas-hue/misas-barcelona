<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misas Barcelona</title>
<meta name="description" content="Encuentra misas, confesiones y adoración eucarística en las parroquias de la Archidiócesis de Barcelona.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-home">

<!-- Inicio: un único campo para escribir, como un chat -->
<section class="home" id="home" aria-labelledby="homeTitle">
  <div class="home-inner">
    <p class="eyebrow">Archidiócesis de Barcelona · <span id="parishCount">211</span> parroquias</p>
    <h1 id="homeTitle">¿Dónde quieres ir a <em>misa</em>?</h1>
    <p class="lede">Dime dónde estás y a qué hora te va bien. También busco <em>confesiones</em> y <em>adoración</em>.</p>

    <form class="composer big" id="homeForm" autocomplete="off">
      <textarea id="homeInput" rows="1" aria-label="Escribe dónde y cuándo quieres ir a misa"></textarea>
      <button class="send" type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <ul class="ideas" id="ideas" aria-label="Ideas para preguntar"></ul>

    <div class="home-links">
      <button type="button" class="ghost" id="nearNow">Misas cerca de mí ahora</button>
      <button type="button" class="ghost" id="openMap">Explorar el mapa</button>
    </div>
  </div>
  <footer class="home-foot">Horarios de la <a href="https://esglesia.barcelona/parroquia/" target="_blank" rel="noopener">web del Arzobispado</a>. Confírmalos con la parroquia.</footer>
</section>

<!-- Resultados: conversación + mapa -->
<main class="app" id="app" aria-label="Resultados">
  <aside class="panel" id="panel">
    <header class="panel-head">
      <button type="button" class="brand" id="goHome" aria-label="Volver al inicio">Misas <em>Barcelona</em></button>
      <button type="button" class="ghost small" id="filtersBtn" aria-expanded="false" aria-controls="filters">Filtros</button>
    </header>

    <section class="filters" id="filters" hidden aria-label="Filtros">
      <div class="seg" role="group" aria-label="Qué buscas">
        <button type="button" data-kind="mass" class="on">Misa</button>
        <button type="button" data-kind="confession">Confesión</button>
        <button type="button" data-kind="adoration">Adoración</button>
      </div>
      <div class="grid3">
        <label>Día<select id="fDay"></select></label>
        <label>Desde<select id="fFrom"></select></label>
        <label>Hasta<select id="fTo"></select></label>
      </div>
      <div class="grid2">
        <label>Arciprestazgo<select id="fArx"></select></label>
        <label>Comunidad pastoral<select id="fCom"></select></label>
        <label>Municipio<select id="fMun"></select></label>
        <label>Idioma<select id="fLang">
          <option value="">Cualquiera</option><option value="ca">Catalán</option>
          <option value="es">Castellano</option><option value="other">Otros idiomas</option>
        </select></label>
      </div>
      <input id="fText" type="search" placeholder="Nombre de la parroquia o calle" aria-label="Buscar por nombre o calle">
      <button type="button" class="link" id="reset">Quitar filtros</button>
    </section>

    <div class="thread" id="thread" aria-live="polite"></div>

    <section class="detail" id="detail" hidden aria-label="Ficha de la parroquia"></section>

    <form class="composer" id="chatForm" autocomplete="off">
      <textarea id="chatInput" rows="1" aria-label="Escribe otra búsqueda"></textarea>
      <button class="send" type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </aside>
  <div class="mapwrap"><div id="map" role="region" aria-label="Mapa de parroquias"></div></div>
</main>

<script src="config.js"></script>
<script src="data/parroquias.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="zonas.js"></script>
<script src="app.js"></script>
</body>
</html>
